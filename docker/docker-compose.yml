services:
  mysql:
    image: mysql:8.0
    container_name: rag-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: rag_db
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - ../data/mysql:/var/lib/mysql
    networks:
      - rag-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ../data/qdrant:/qdrant/storage
    networks:
      - rag-net

networks:
  rag-net:
    driver: bridge