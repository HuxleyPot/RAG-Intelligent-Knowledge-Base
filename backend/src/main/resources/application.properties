spring.application.name=backend
# 服务端口
server.port=18080

# MySQL 数据库连接 (Docker中启动的)
spring.datasource.url=jdbc:mysql://localhost:3306/rag_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
spring.datasource.username=${DB_USERNAME:root}
# 优先读取环境变量 DB_PASSWORD；未设置时回退到本地默认值，保证本地开箱即用
spring.datasource.password=${DB_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis-Plus 配置：打印 SQL 日志方便调试
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl